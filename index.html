<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Politie Academie: Geïntegreerde Verhoor-Analyse</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --police: #1a2a6c; --success: #27ae60; --warning: #f39c12; --danger: #e74c3c;
        }

        body { 
            background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 10px; height: 100vh; overflow: hidden;
        }

        .app-container { display: flex; gap: 15px; height: calc(100vh - 20px); }

        /* Verhoor Sectie */
        .verhoor-box { flex: 1; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #334155; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; background: #f1f5f9; display: flex; flex-direction: column; gap: 10px; border-radius: 0 0 12px 12px; }
        
        /* Analyse & Dashboard */
        .analyse-box { flex: 1.6; background: #fff; border-radius: 12px; display: flex; flex-direction: column; color: #1e293b; }
        
        .dashboard { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 15px; 
            background: #f8fafc; border-bottom: 2px solid #e2e8f0; border-radius: 12px 12px 0 0;
        }

        .point {
            position: relative; padding: 10px 5px; background: #fff; border: 1px solid #cbd5e1;
            border-radius: 6px; text-align: center; font-size: 0.7em; font-weight: bold;
            cursor: help; color: #94a3b8; transition: 0.3s;
        }
        .point.met { background: #dcfce7; border-color: var(--success); color: var(--success); }
        .point.error { border-color: var(--danger); color: var(--danger); }

        /* Mousetip */
        .point .tip {
            visibility: hidden; width: 150px; background: #334155; color: #fff;
            padding: 8px; position: absolute; z-index: 100; bottom: 125%; left: 50%;
            transform: translateX(-50%); border-radius: 6px; font-weight: normal; font-size: 1.1em;
        }
        .point:hover .tip { visibility: visible; }

        /* Status & Timer */
        .status-bar { display: flex; justify-content: space-between; padding: 10px 15px; background: var(--police); color: white; border-radius: 12px 12px 0 0; font-size: 0.8em; }
        #stress-meter { height: 4px; background: var(--success); width: 100%; transition: 1s; }

        /* Editor */
        .editor { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        textarea { flex: 1; padding: 15px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1em; line-height: 1.5; resize: none; outline: none; }
        
        .bubble { padding: 10px 15px; border-radius: 15px; font-size: 0.9em; max-width: 85%; line-height: 1.4; }
        .evi { align-self: flex-start; background: #e2e8f0; color: #1e293b; }
        .agent { align-self: flex-end; background: var(--police); color: white; }

        .btn-save { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="verhoor-box">
        <div class="status-bar">
            <span>EVI'S MEEDOOGZAAMHEID: <span id="stress-txt">HOOG</span></span>
            <span id="timer">00:00</span>
        </div>
        <div id="stress-meter"></div>
        <div id="messages">
            <div class="bubble evi"><b>Evi:</b> Goedendag agent. Ik ben Evi de Vries (04-11-2002). Ik kom aangifte doen van de diefstal van mijn witte Gazelle Esprit... kunt u de details noteren?</div>
        </div>
        <div style="padding:15px; background:white; display:flex; gap:10px;">
            <input type="text" id="chatInp" style="flex:1; padding:12px; border:1px solid #ccc; border-radius:6px;" placeholder="Stel je vraag..." onkeypress="if(event.key==='Enter') verhoor()">
            <button onclick="verhoor()" style="padding:10px 20px; background:var(--police); color:white; border:none; border-radius:6px; cursor:pointer;">VRAAG</button>
        </div>
    </div>

    <div class="analyse-box">
        <div class="dashboard" id="dash">
            </div>
        <div class="editor">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <h3 style="margin:0;">Proces-Verbaal van Aangifte</h3>
                <b id="score-val" style="color:var(--success)">VOLTOOID: 0%</b>
            </div>
            <textarea id="pvEditor" oninput="analyseerTekst()" placeholder="Begin hier met het officieel verslag..."></textarea>
            
            <div id="hint-box" style="margin-top:10px; color:#64748b; font-size:0.85em; font-style:italic;">
                Tip: Noteer eerst de personalia van Evi de Vries.
            </div>

            <button class="btn-save" onclick="opslaan()">INDIENEN BIJ OFFICIER</button>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE & DATA ---
    const firebaseConfig = { apiKey: "AIzaSyC-Of0AUOd-kVo2RKxYc-68Gr-RO4HdRk0", authDomain: "q2aangifteles2.firebaseapp.com", databaseURL: "https://q2aangifteles2-default-rtdb.europe-west1.firebasedatabase.app", projectId: "q2aangifteles2" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const criteria = [
        { id: 'c1', l: 'NAAM', w: ['evi', 'vries'], t: 'Naam: Evi de Vries' },
        { id: 'c2', l: 'GEB.DATUM', w: ['4 november', '2002'], t: 'Geboren: 04-11-2002' },
        { id: 'c3', l: 'MERK', w: ['gazelle', 'esprit'], t: 'Merk/Type: Gazelle Esprit' },
        { id: 'c4', l: 'KLEUR', w: ['wit', 'witte'], t: 'Kleur: Wit' },
        { id: 'c5', l: 'LOCATIE', w: ['vredenburg', '24'], t: 'Plaats: Vredenburg 24-B' },
        { id: 'c6', l: 'TIJD', w: ['3 uur', 'nacht'], t: 'Tijdstip: ca. 03:00' },
        { id: 'c7', l: 'SLOT', w: ['cijferslot', 'doorgeknipt'], t: 'Beveiliging: Doorgeknipt' },
        { id: 'c8', l: 'TOESTEMMING', w: ['geen toestemming'], t: 'Geen toestemming verleend' },
        { id: 'c9', l: 'WAARDE', w: ['650'], t: 'Dagwaarde: € 650,-' },
        { id: 'c10', l: 'STAD', w: ['utrecht'], t: 'Woonplaats: Utrecht' }
    ];

    let stress = 0;
    let questions = 0;

    // --- DASHBOARD SETUP ---
    const dash = document.getElementById('dash');
    criteria.forEach(c => {
        dash.innerHTML += `<div class="point" id="${c.id}">${c.l}<span class="tip">${c.t}</span></div>`;
    });

    // --- VERHOOR LOGICA ---
    function verhoor() {
        const inp = document.getElementById('chatInp');
        const box = document.getElementById('messages');
        if(!inp.value) return;

        questions++;
        stress = Math.min(questions * 10, 100);
        updateStress();

        box.innerHTML += `<div class="bubble agent">${inp.value}</div>`;
        const v = inp.value.toLowerCase();
        inp.value = '';

        setTimeout(() => {
            let r = "";
            if (v.includes("sorry") || v.includes("begrijp") || v.includes("rustig")) {
                questions = Math.max(0, questions - 3);
                updateStress();
                r = "Dank u voor uw begrip. Het is gewoon erg vervelend allemaal.";
            } else if (stress > 80) {
                r = "Ik heb dit nu al zo vaak gezegd! Kunt u niet gewoon uw werk doen?";
            } else {
                if(v.includes("waar")) r = "Ik woon aan de Vredenburg 24-B in Utrecht.";
                else if(v.includes("slot")) r = "Het cijferslot lag kapot op straat.";
                else if(v.includes("waarde")) r = "De fiets was 650 euro waard.";
                else if(v.includes("toestemming")) r = "Natuurlijk heb ik niemand toestemming gegeven om mijn fiets te lenen!";
                else r = "Dat heb ik in het begin al verteld, toch? Een witte Gazelle...";
            }
            box.innerHTML += `<div class="bubble evi"><b>Evi:</b> ${r}</div>`;
            box.scrollTop = box.scrollHeight;
        }, 600);
    }

    function updateStress() {
        const meter = document.getElementById('stress-meter');
        const txt = document.getElementById('stress-txt');
        meter.style.width = (100 - stress) + "%";
        if(stress > 70) { meter.style.background = "var(--danger)"; txt.innerText = "KRIBBIG"; }
        else if(stress > 40) { meter.style.background = "var(--warning)"; txt.innerText = "ONgeduldig"; }
        else { meter.style.background = "var(--success)"; txt.innerText = "MEEWERKEND"; }
    }

    // --- DIEPTE ANALYSE LOGICA ---
    function analyseerTekst() {
        const txt = document.getElementById('pvEditor').value.toLowerCase();
        let score = 0;
        let missing = [];

        criteria.forEach(c => {
            const el = document.getElementById(c.id);
            if(c.w.some(word => txt.includes(word))) {
                el.classList.add('met');
                score++;
            } else {
                el.classList.remove('met');
                missing.push(c.t);
            }
        });

        document.getElementById('score-val').innerText = `VOLTOOID: ${score * 10}%`;
        const hintBox = document.getElementById('hint-box');
        if(score < 10) {
            hintBox.innerText = "Nog nodig: " + (missing[0] || "...");
        } else {
            hintBox.innerHTML = "<b style='color:var(--success)'>Dossier juridisch compleet!</b>";
        }
    }

    // --- TIMER & OPSLAAN ---
    let s = 0; setInterval(() => { s++; document.getElementById('timer').innerText = Math.floor(s/60).toString().padStart(2,'0')+":"+(s%60).toString().padStart(2,'0'); }, 1000);
    function opslaan() { 
        const pv = document.getElementById('pvEditor').value;
        if(pv.length < 50) return alert("PV is te summier.");
        db.ref('dossiers').push({ tekst: pv, stress_level: stress });
        alert("Aangifte succesvol verwerkt.");
    }
</script>
</body>
</html>
