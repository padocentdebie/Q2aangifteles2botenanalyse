<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Politie Academie: High-Performance Analyse</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --police-blue: #1a2a6c;
            --success: #27ae60;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --bg-dark: #0f172a;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #e2e8f0; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 10px; 
            height: 100vh; overflow: hidden;
        }

        .layout { display: flex; gap: 15px; height: calc(100vh - 20px); max-width: 1800px; margin: auto; }

        /* Linkerpaneel: De Getuige */
        .panel-verhoor { flex: 1; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #334155; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
        
        /* Rechterpaneel: Analyse & PV */
        .panel-analyse { flex: 1.6; background: #ffffff; border-radius: 12px; display: flex; flex-direction: column; color: #1e293b; position: relative; }

        /* Het 10-punts Dashboard */
        .analysis-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 15px; 
            background: #f1f5f9; border-bottom: 2px solid #e2e8f0;
        }

        .point-card {
            position: relative; padding: 10px; background: white; border: 1px solid #cbd5e1;
            border-radius: 6px; text-align: center; font-size: 0.75em; font-weight: bold;
            cursor: help; transition: 0.3s; color: #64748b;
        }

        .point-card.met { background: #dcfce7; border-color: var(--success); color: var(--success); }

        /* De Mousetip/Tooltip */
        .point-card .tip {
            visibility: hidden; width: 180px; background-color: #334155; color: #fff;
            text-align: center; border-radius: 6px; padding: 8px; position: absolute;
            z-index: 10; bottom: 110%; left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity 0.3s; font-weight: normal; font-size: 0.9em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); pointer-events: none;
        }
        .point-card:hover .tip { visibility: visible; opacity: 1; }

        /* Editor */
        .editor-space { flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        textarea { 
            width: 100%; flex: 1; padding: 15px; border: 2px solid #cbd5e1; 
            border-radius: 8px; font-size: 1.05em; line-height: 1.6; resize: none; outline: none;
        }
        textarea:focus { border-color: var(--police-blue); box-shadow: 0 0 10px rgba(26,42,108,0.1); }

        /* Bubbles */
        .bubble { padding: 10px 14px; border-radius: 15px; font-size: 0.9em; max-width: 85%; }
        .bot { align-self: flex-start; background: #e2e8f0; color: #1e293b; }
        .user { align-self: flex-end; background: var(--police-blue); color: white; }

        /* Info Bar */
        .info-bar { display: flex; justify-content: space-between; padding: 10px 20px; background: #1a2a6c; color: white; font-size: 0.8em; }
        .btn-action { background: var(--success); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="layout">
    <div class="panel-verhoor">
        <div class="info-bar">
            <span>AGENT: LIVE VERHOOR</span>
            <span id="timer">TIJD: 00:00</span>
        </div>
        <div id="messages">
            <div class="bubble bot"><b>Evi:</b> Hallo... ik ben Evi. Mijn witte Gazelle is gestolen bij het Vredenburg. Kunt u een rapport opmaken?</div>
        </div>
        <div style="padding:15px; background:white; display:flex; gap:10px;">
            <input type="text" id="cInput" style="flex:1; padding:10px;" placeholder="Stel een vraag..." onkeypress="if(event.key==='Enter') chat()">
            <button onclick="chat()" class="btn-action" style="width:auto; margin:0;">STEL VRAAG</button>
        </div>
    </div>

    <div class="panel-analyse">
        <div class="analysis-grid" id="grid">
            </div>

        <div class="editor-space">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0 0 10px 0;">Proces-Verbaal van Aangifte</h3>
                <span id="score" style="font-weight:bold; color:var(--success);">Voortgang: 0%</span>
            </div>
            <textarea id="pvArea" oninput="analyze()" placeholder="Noteer de feiten op basis van het verhoor..."></textarea>
            
            <button class="btn-action" onclick="save()">DOSSIER VOLTOOIEN & OPSLAAN</button>
            <button onclick="clearDB()" style="background:none; border:none; color:#94a3b8; font-size:0.7em; cursor:pointer; margin-top:5px;">Systeem-reset</button>
        </div>
    </div>
</div>

<script>
    // --- DATABASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyC-Of0AUOd-kVo2RKxYc-68Gr-RO4HdRk0",
        authDomain: "q2aangifteles2.firebaseapp.com",
        databaseURL: "https://q2aangifteles2-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "q2aangifteles2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- 10 CRUCIALE PUNTEN DATA ---
    const checkPoints = [
        { id: 'p1', label: 'IDENTITEIT', words: ['evi', 'vries'], tip: 'Vermeld de volledige voor- en achternaam van het slachtoffer.' },
        { id: 'p2', label: 'GEBOORTE', words: ['2002', '4 november'], tip: 'Cruciaal voor het dossier: Wanneer is Evi geboren?' },
        { id: 'p3', label: 'OBJECT', words: ['gazelle', 'esprit'], tip: 'Specificeer het merk en het type fiets nauwkeurig.' },
        { id: 'p4', label: 'KLEUR', words: ['wit', 'witte'], tip: 'De kleur is het eerste kenmerk voor opsporing.' },
        { id: 'p5', label: 'LOCATIE', words: ['vredenburg', '24'], tip: 'Waar precies stond de fiets? (Straat + Huisnummer).' },
        { id: 'p6', label: 'TIJDSTIP', words: ['3 uur', 'nacht', '03:00'], tip: 'Hoe laat vond de diefstal plaats?' },
        { id: 'p7', label: 'BEVEILIGING', words: ['slot', 'cijferslot', 'doorgeknipt'], tip: 'Hoe was de fiets beveiligd en wat is de staat van het slot?' },
        { id: 'p8', label: 'EIGENDOM', words: ['mijn', 'eigenaar', 'toestemming'], tip: 'Staat er expliciet dat zij de eigenaar is en geen toestemming gaf?' },
        { id: 'p9', label: 'WAARDE', words: ['650', 'euro'], tip: 'Wat is de geschatte waarde/aanschafprijs?' },
        { id: 'p10', label: 'WOONPLAATS', words: ['utrecht'], tip: 'Vergeet de huidige woonplaats van de aangever niet.' }
    ];

    // --- DASHBOARD GENEREREN ---
    const grid = document.getElementById('grid');
    checkPoints.forEach(p => {
        const div = document.createElement('div');
        div.className = 'point-card';
        div.id = p.id;
        div.innerHTML = `${p.label} <span class="tip">${p.tip}</span>`;
        grid.appendChild(div);
    });

    // --- ANALYSE FUNCTIE ---
    function analyze() {
        const text = document.getElementById('pvArea').value.toLowerCase();
        let score = 0;

        checkPoints.forEach(p => {
            const isFound = p.words.some(word => text.includes(word));
            const el = document.getElementById(p.id);
            if(isFound) {
                el.classList.add('met');
                score++;
            } else {
                el.classList.remove('met');
            }
        });

        document.getElementById('score').innerText = `Voortgang: ${score * 10}%`;
        if(score === 10) document.getElementById('score').style.color = "#27ae60";
    }

    // --- TIMER ---
    let seconds = 0;
    setInterval(() => {
        seconds++;
        let m = Math.floor(seconds / 60);
        let s = seconds % 60;
        document.getElementById('timer').innerText = `TIJD: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }, 1000);

    // --- CHAT & FIREBASE ---
    function chat() {
        const inp = document.getElementById('cInput');
        const m = document.getElementById('messages');
        if(!inp.value) return;
        
        m.innerHTML += `<div class="bubble user">${inp.value}</div>`;
        const v = inp.value.toLowerCase();
        inp.value = '';

        setTimeout(() => {
            let r = "Kunt u dat nog eens vragen? Ik ben een beetje in de war.";
            if(v.includes("naam")) r = "Mijn naam is Evi de Vries.";
            if(v.includes("geboren")) r = "Ik ben geboren op 4 november 2002.";
            if(v.includes("fiets") || v.includes("merk")) r = "Het is een witte Gazelle Esprit, hij kostte 650 euro.";
            if(v.includes("waar")) r = "Bij het Vredenburg 24-B, aan een lantaarnpaal.";
            if(v.includes("slot")) r = "Ik had een cijferslot, maar dat is doorgeknipt.";
            if(v.includes("hoe laat")) r = "Ik hoorde vannacht rond 3 uur lawaai.";
            
            m.innerHTML += `<div class="bubble bot"><b>Evi:</b> ${r}</div>`;
            m.scrollTop = m.scrollHeight;
        }, 600);
    }

    function save() {
        const pv = document.getElementById('pvArea').value;
        db.ref('archief').push({ tekst: pv, tijd: document.getElementById('timer').innerText });
        alert("PV opgeslagen in het politiesysteem.");
        document.getElementById('pvArea').value = '';
        analyze();
    }

    function clearDB() { if(confirm("Systeem resetten?")) db.ref('archief').remove(); }
</script>
</body>
</html>
